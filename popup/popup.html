<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../lib/css/bootstrap.min.css" />
    <script src="../lib/js/bootstrap.min.js">
    </script>
    <style>
        html,
        body {
            width: 320px;
            min-width: 320px;
            margin: 0;
        }
        .popup-container {
            width: 320px;
            min-width: 320px;
            max-width: 320px;
            box-sizing: border-box;
        }
        .header{
            padding: 5px 20px 0px 20px;
        }
        .header-link {
            text-decoration: none;
            color: black;
        }
        .ad-mode-group {
            margin-top: 10px;
            margin-bottom: 10px;
            display: none;
        }
        .footer {
            border-top: 1px solid #eee;
            padding-top: 10px;
            margin-top: 10px;
            text-align: center;
        }
        @media (prefers-color-scheme: dark) {
            :root { color-scheme: dark; }
            body { background-color: #1f2328; color: #f0f3f6; }
            .header-link { color: #f0f3f6; }
            .footer { border-color: #444c56; }
        }
    </style>
</head>

<body>
    <div class="header">
        <a class="header-link" href="#" id="header-link">
            <img src="../icons/objection128x128.png" alt="logo" height="20px">
            <span style="vertical-align: middle;">自动异议</span>
        </a>
    </div>
    <div class="popup-container p-3">
        <div class="input-group mb-3">
            <label class="input-group-text" for="bubble-style" id="basic-addon1">切换气泡</label>
            <select class="form-select" id="bubble-style" aria-labelledby="basic-addon1">
                <option value="0">异议！</option>
                <option value="1">等等！</option>
                <option value="2">看招！</option>
                <option value="3">随机</option>
                <option value="custom">自定义</option>
            </select>
        </div>
        <div class="mb-4">
            <label class="form-label" for="bubble-size">气泡大小</label>
            <input type="range" class="form-range" id="bubble-size" min="1" max="50" step="1" value="10">
            <div class="d-flex justify-content-between">
                <span>小</span>
                <span>大</span>
            </div>
        </div>
        <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center">
                <label class="form-label mb-1" for="effect-volume-input">异议特效音量</label>
                <output id="effect-volume-value" for="effect-volume-input">70%</output>
            </div>
            <input type="range" class="form-range" id="effect-volume-input" min="0" max="100" step="1" value="70">
            <div class="d-flex justify-content-between">
                <span>静音</span>
                <span>最大</span>
            </div>
        </div>
        <div class="form-check form-switch mb-2">
            <input class="form-check-input" type="checkbox" role="switch" id="objection-switch">
            <label class="form-check-label" for="objection-switch">异议所有网页！</label>
        </div>
        <div class="form-check form-switch mb-2">
            <input class="form-check-input" type="checkbox" role="switch" id="ad-blocker-switch">
            <label class="form-check-label" for="ad-blocker-switch">异议所有广告！</label>
        </div>
        <!-- 添加广告处理方式选择 -->
        <div class="ad-mode-group" id="ad-mode-group">
            <label class="form-label" id="ad-mode-label">广告处理方式</label>
            <div role="radiogroup" aria-labelledby="ad-mode-label">
            <div class="form-check">
                <input class="form-check-input" type="radio" name="ad-mode" id="ad-mode-placeholder" value="placeholder" checked>
                <label class="form-check-label" for="ad-mode-placeholder">使用文字替换</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="ad-mode" id="ad-mode-remove" value="remove">
                <label class="form-check-label" for="ad-mode-remove">删除广告</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="ad-mode" id="ad-mode-image" value="image">
                <label class="form-check-label" for="ad-mode-image">使用图片替换</label>
            </div>
            </div>
            
            <!-- 添加广告拦截触发方式选择 -->
            <div class="mt-3">
                <label class="form-label" id="ad-trigger-label">广告拦截触发方式</label>
                <div role="radiogroup" aria-labelledby="ad-trigger-label">
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="ad-trigger-mode" id="ad-trigger-auto" value="auto" checked>
                    <label class="form-check-label" for="ad-trigger-auto">页面加载时拦截</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="ad-trigger-mode" id="ad-trigger-click" value="click">
                    <label class="form-check-label" for="ad-trigger-click">点击广告时拦截</label>
                </div>
                </div>
            </div>
        </div>
        
        <!-- 添加高级设置链接 -->
        <div class="footer">
            <a href="#" id="advanced-settings-link" class="btn btn-sm btn-outline-secondary">高级设置</a>
        </div>
    </div>
    <script src="popup.js"></script>
</body>

</html>
